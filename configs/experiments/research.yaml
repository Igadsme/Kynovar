name: research
dataset:
  worlds: 200
  experiments_per_world: 30
  duration: 4.0
  dt: 0.02
  difficulty: 2
  seed: 42
split:
  train: 0.70
  validation: 0.15
  test: 0.15
  seed: 42
train:
  epochs: 40
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  seed: 42
  device: auto
  sequence_length: 8
  stride: 1
  rollout_steps: 1
  hidden_dim: 128
  gnn_layers: 2
  patience: 6
  lambda_acceleration: 1.0
  lambda_position: 1.0
  lambda_velocity: 1.0
  lambda_rollout: 1.0
eval:
  horizons: [1, 10, 25, 50, 100]
  num_workers: 0
