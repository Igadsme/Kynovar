name: smoke
dataset:
  worlds: 6
  experiments_per_world: 2
  duration: 0.8
  dt: 0.05
  difficulty: 2
  seed: 7
split:
  train: 0.70
  validation: 0.15
  test: 0.15
  seed: 7
train:
  epochs: 2
  batch_size: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  seed: 7
  device: cpu
  sequence_length: 4
  stride: 1
  rollout_steps: 1
  hidden_dim: 32
  gnn_layers: 1
  patience: 2
  lambda_acceleration: 1.0
  lambda_position: 1.0
  lambda_velocity: 1.0
  lambda_rollout: 1.0
eval:
  horizons: [1, 4]
  num_workers: 0
