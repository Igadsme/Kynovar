[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kynovar"
version = "0.1.0"
description = "Autonomous discovery of physical laws in unknown dynamical systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kynovar contributors" }]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["kynovar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
