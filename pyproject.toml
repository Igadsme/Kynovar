[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kynovar"
version = "0.8.0"
description = "Autonomous discovery of physical laws in unknown dynamical systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kynovar contributors" }]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
    "torch>=2.2",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
]

[tool.setuptools.packages.find]
include = ["kynovar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
